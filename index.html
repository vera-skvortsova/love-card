<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для тебя ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      text-align: center;
      padding: 30px;
      animation: fadeIn 2s ease;
      z-index: 2;
    }

    h1 { font-size: 2.5rem; margin-bottom: 20px; }
    p  { font-size: 1.2rem; max-width: 500px; margin: 0 auto 30px; }

    button {
      padding: 15px 40px;
      border: 2px solid white;
      background: transparent;
      color: white;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      background: white;
      color: #1a1a2e;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .heart {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      animation: float linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 1; }
      to   { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Привет, [Имя] ❤️</h1>
    <p id="text">Нажми на кнопку — у меня для тебя кое-что есть.</p>
    <button onclick="showMessage()">Открыть 💌</button>
  </div>

  <script>
    const messages = [
      "Ты — самое важное, что случилось в моей жизни.",
      "Спасибо, что ты рядом каждый день.",
      "Ты делаешь этот мир теплее просто тем, что существуешь.",
      "Я люблю тебя больше, чем могу сказать словами."
    ];
    let i = 0;

    function showMessage() {
      document.getElementById('text').textContent = messages[i];
      i = (i + 1) % messages.length;
    }

    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['❤️','💕','🌸','✨','💖'][Math.floor(Math.random()*5)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 8000);
    }, 400);
  </script>
</body>
</html>
